<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amer Gari Game</title>
<style>body{margin:0;background:#222;display:flex;flex-direction:column;align-items:center;color:#fff;font-family:sans-serif}.ad{width:320px;height:50px;background:#333;display:flex;align-items:center;justify-content:center;color:yellow;border:1px dashed yellow;margin:5px}#score{font-size:24px;margin:10px}#box{position:relative;width:360px;height:500px;background:#111;border:2px solid #fff;overflow:hidden}#player{position:absolute;bottom:20px;width:48px;height:80px;background:red;left:156px;border-radius:8px}.enemy{position:absolute;width:48px;height:80px;background:blue;border-radius:8px}#ctrl{margin-top:12px;display:flex;gap:20px}.b{width:80px;height:80px;border:2px solid #fff;background:#444;color:#fff;font-size:18px;border-radius:12px}</style>
</head><body>
<div class="ad"><div id="container-fe37805c79eb44771e1f77b1d31399ef"></div></div>
<div id="score">Score: 0</div>
<div id="box"><div id="player"></div></div>
<div id="ctrl"><button class="b" id="left">LEFT</button><button class="b" id="right">RIGHT</button></div>
<div class="ad"><div id="container-fe37805c79eb44771e1f77b1d31399ef-2"></div></div>

<script async data-cfasync="false" src="https://www.highperformanceformat.com/fe37805c79eb44771e1f77b1d31399ef/invoke.js"></script>
<script>
let px=156,score=0;let box=document.getElementById('box');let player=document.getElementById('player');let scoreEl=document.getElementById('score');
document.getElementById('left').onclick=()=>{px=Math.max(0,px-30);player.style.left=px+'px';}
document.getElementById('right').onclick=()=>{px=Math.min(312,px+30);player.style.left=px+'px';}
function spawn(){let e=document.createElement('div');e.className='enemy';e.style.left=Math.floor(Math.random()*7)*48+'px';e.style.top='-80px';box.appendChild(e);let fall=setInterval(()=>{let t=parseInt(e.style.top)+5;e.style.top=t+'px';let er=e.getBoundingClientRect();let pr=player.getBoundingClientRect();if(!(er.right<pr.left||er.left>pr.right||er.bottom<pr.top||er.top>pr.bottom)){clearInterval(fall);alert('Game Over Score: '+score);location.reload()}if(t>500){clearInterval(fall);e.remove();score++;scoreEl.innerText='Score: '+score}},30)}setInterval(spawn,1000);
</script>
<script data-cfasync="false" src="https://bicea.org/14/7d9de99940958a19c652c9d8141a0ee7"></script>
</body></html>
